[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#111827"
font = "sans serif"
# The root font size, and the only lever that reaches a dataframe. `st.dataframe`
# is drawn on a canvas by glide-data-grid, so no stylesheet can touch its cell
# text; the grid sizes itself at 0.875 of the root, which at the default 16px is
# the 14px that made every table on this dashboard smaller than the prose
# explaining it. 17 puts a cell at just under 15px and lifts Streamlit's own
# widget text with it, which is the "fonts are too small" complaint answered at
# the root rather than one selector at a time. theme.py's own sizes are declared
# in pixels precisely so they are not scaled a second time by this.
baseFontSize = 17
# The header row cannot be given a heavier weight from here - it, too, is canvas -
# so it is separated from the data by a tint instead.
dataframeHeaderBackgroundColor = "#f1f5f9"
dataframeBorderColor = "#e5e7eb"
# The same eight hues as theme_tokens.SERIES (and theme.CATEGORICAL, which is
# that same list), in the same order. Streamlit applies these to Plotly,
# Altair and Vega-Lite alike, which is what makes an `st.bar_chart` and a
# `theme.plot` figure on the same page agree. TOML cannot import Python, so
# this list is hand-kept in step with theme_tokens.SERIES; a mismatch is not a
# runtime error, it is two charts on the same page in different colours - that
# is exactly what tests/test_theme_tokens.py checks on every run.
chartCategoricalColors = [
    "#2563eb",
    "#eb6834",
    "#1baf7a",
    "#eda100",
    "#e87ba4",
    "#008300",
    "#4a3aa7",
    "#e34948",
]
